services:
  - type: web
    name: websentinel-api
    runtime: node
    rootDir: .
    buildCommand: pnpm install --ignore-scripts && cd artifacts/api-server && node ./build.mjs
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: info
      # Add these in the Render dashboard — do not put secrets here:
      # CORS_ORIGINS
      # FIREBASE_PROJECT_ID
      # FIREBASE_CLIENT_EMAIL
      # FIREBASE_PRIVATE_KEY
      # VT_API_KEY
